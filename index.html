<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFT6135 — Representation Learning Study Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>IFT6135</h1>
        <span class="subtitle">Representation Learning — Study Tool</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-section="dashboard" role="tab">Dashboard</button>
        <button class="tab" data-section="true-false" role="tab">True / False</button>
        <button class="tab" data-section="multiple-choice" role="tab">Multiple Choice</button>
        <button class="tab" data-section="math-formulation" role="tab">Math Formulation</button>
        <button class="tab" data-section="contextual" role="tab">Contextual</button>
      </nav>
    </div>
  </header>

  <main class="container app-main">

    <!-- Dashboard -->
    <section id="dashboard" class="view active">
      <div class="hero">
        <h2>Welcome back.</h2>
        <p class="muted">Track your progress across the four revision sections below. Progress is saved locally in your browser.</p>
      </div>

      <div class="cards" id="dashboard-cards"></div>

      <div class="dashboard-actions">
        <button id="reset-all" class="btn btn-danger">Reset All Progress</button>
      </div>
    </section>

    <!-- Quiz sections (shared template) -->
    <section id="quiz-view" class="view">
      <div class="quiz-header">
        <h2 id="section-title"></h2>
        <div class="quiz-meta">
          <span id="question-counter" class="pill"></span>
          <span id="section-score" class="pill pill-accent"></span>
        </div>
      </div>

      <div class="question-card">
        <div id="question-body" class="question-body"></div>
        <div id="answers" class="answers"></div>
        <div id="feedback" class="feedback hidden"></div>
      </div>

      <div class="quiz-controls">
        <button id="prev-btn" class="btn btn-ghost">&larr; Previous</button>
        <button id="check-btn" class="btn btn-primary">Check Answer</button>
        <button id="next-btn" class="btn btn-ghost">Next &rarr;</button>
      </div>

      <div class="quiz-footer">
        <button id="reset-section" class="btn btn-subtle">Reset this section</button>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <small>Client-side only · Progress stored in <code>localStorage</code> · Built for IFT6135 revision</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
